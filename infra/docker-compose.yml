# Optional production-style stack.
# The default dev/demo path uses local SQLite + in-process Qdrant and does
# NOT require Docker. Use this file to run the managed-service-style stack:
#   docker compose up -d qdrant postgres redis
# Then point the backend env at them (see .env.example).

version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invest_research
      POSTGRES_USER: ira
      POSTGRES_PASSWORD: ira_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Backend and frontend are run directly (python -m app.cli serve / npm run dev)
  # during development. Containerize them with the Dockerfiles below when ready.

volumes:
  qdrant_data:
  pg_data:
