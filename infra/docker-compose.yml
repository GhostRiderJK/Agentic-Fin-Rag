# FinRAG 2.0 development stack.
#
#   docker compose -f infra/docker-compose.yml up -d            # data services
#   docker compose -f infra/docker-compose.yml --profile app up -d   # + api/web
#
# MongoDB is the primary store. `mongo` is the app database; `mongo-test` is a
# separate, volume-free instance on host port 27018 that the isolation suite
# runs against (backend/tests/mongo_support.py defaults MONGODB_TEST_URL there).
# The image is mongodb/mongodb-atlas-local because it also provides Atlas
# Search and Vector Search, which the retrieval layer uses for $search/$vectorSearch.
#
# AUTH IS DISABLED ON PURPOSE — these are local dev containers with no
# tenant-reachable network exposure beyond 127.0.0.1. Set real credentials and
# remove DEV_DISABLE_AUTH before any shared deployment.
#
# The backend container mounts the repo-root .env read-only and lets the app's
# own configuration loader parse it, then overrides the few values that differ
# inside a container (bind host, service DNS names). Secrets stay in .env and
# are never committed.

name: finrag

services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: finrag-mongo
    restart: unless-stopped
    # Host port 27019, not 27017: a native mongod.exe Windows service already
    # owns 27017 on this machine and holds data for other projects. It also
    # cannot serve $vectorSearch/$search, so FinRAG must not silently fall back
    # to it. Container-internal port stays 27017.
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27019}:27017"
    environment:
      DEV_DISABLE_AUTH: "1"
      MONGODB_MEM_LIMIT_MB: "1024"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "/usr/bin/mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Ephemeral, isolated instance for the test suite so tests can never reach
  # the app database on port 27017.
  mongo-test:
    image: mongodb/mongodb-atlas-local:latest
    container_name: finrag-mongo-test
    ports:
      - "127.0.0.1:${MONGO_TEST_PORT:-27018}:27017"
    environment:
      DEV_DISABLE_AUTH: "1"
      MONGODB_MEM_LIMIT_MB: "1024"
    healthcheck:
      test: ["CMD", "/usr/bin/mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: finrag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Only needed when JOBS_MODE=celery.
  redis:
    image: redis:7-alpine
    container_name: finrag-redis
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: finrag-backend
    profiles: ["app"]
    restart: unless-stopped
    # Host port defaults to 8010, not 8000: a `ira serve` process running on the
    # host already owns 8000 on this machine. The frontend reaches the API over
    # the compose network at backend:8000 regardless of this mapping.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8010}:8000"
    # The app reads its own .env (see app/core/config.py precedence: process env
    # beats the .env file). It is mounted read-only rather than passed through
    # Compose's `env_file:` because Compose's parser keeps a trailing
    # "  # comment" as part of the value, which python-dotenv correctly strips.
    volumes:
      - ../.env:/app/.env:ro
      - backend_data:/app/data
    environment:
      # Values that must differ from the host .env inside a container.
      APP_HOST: "0.0.0.0"
      MONGODB_URL: "mongodb://mongo:27017"
      QDRANT_MODE: "remote"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_PATH: ""
      STORAGE_PATH: "/app/data/storage"
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js routes manifest at build time.
        BACKEND_URL: "http://backend:8000"
    container_name: finrag-frontend
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      # The Next /api/* rewrite target (see next.config.js).
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  qdrant_data:
  backend_data:
